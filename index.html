<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RDP → XFreeRDP</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:"Segoe UI",Arial,sans-serif;background:radial-gradient(circle at top,#24334a 0,#111827 45%,#090d14 100%);color:#e5e7eb;display:flex;flex-direction:column}.page{flex:1;width:100%;max-width:1100px;margin:0 auto;padding:55px 24px 30px}.header{text-align:center;margin-bottom:34px}.header h1{margin:0;font-size:34px;font-weight:650;letter-spacing:-.5px}.header h1 span{color:#60a5fa}.subtitle{margin-top:9px;color:#94a3b8;font-size:15px}.card{background:rgba(17,24,39,.88);border:1px solid #273449;border-radius:18px;padding:24px;box-shadow:0 22px 60px rgba(0,0,0,.32);backdrop-filter:blur(8px)}#dropZone{min-height:220px;border:2px dashed #475569;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:.2s ease;background:rgba(30,41,59,.35)}#dropZone:hover{border-color:#60a5fa;background:rgba(37,99,235,.08)}#dropZone.dragover{border-color:#60a5fa;background:rgba(37,99,235,.15);transform:scale(1.005)}.rdp-icon{width:62px;height:62px;border-radius:15px;background:#2563eb;display:flex;align-items:center;justify-content:center;margin-bottom:18px;box-shadow:0 8px 25px rgba(37,99,235,.3);font-size:25px;font-weight:700;color:#fff}.drop-title{font-size:19px;font-weight:600}.drop-subtitle{color:#94a3b8;margin-top:7px;font-size:14px}#fileInput{display:none}#resultBlock{display:none;margin-top:22px}.info-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}.info-item{background:#0d1420;border:1px solid #263244;border-radius:10px;padding:13px 15px;min-width:0}.info-label{display:block;color:#64748b;font-size:11px;text-transform:uppercase;letter-spacing:.7px;margin-bottom:5px}.info-value{display:block;color:#e2e8f0;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.info-value.active{color:#86efac}.result-title{margin:0 0 10px 2px;font-size:14px;font-weight:600;color:#cbd5e1}.terminal{position:relative;background:#05080d;border:1px solid #253044;border-radius:12px;overflow:hidden}.terminal-bar{height:35px;background:#111827;border-bottom:1px solid #202b3d;display:flex;align-items:center;padding:0 13px;gap:6px}.dot{width:9px;height:9px;border-radius:50%;background:#475569}textarea{width:100%;min-height:175px;border:0;outline:0;resize:vertical;padding:18px;background:#05080d;color:#86efac;font-family:Consolas,"Courier New",monospace;font-size:14px;line-height:1.6}.actions{display:flex;align-items:center;gap:14px;margin-top:14px}button{border:0;border-radius:9px;background:#2563eb;color:#fff;font-family:inherit;font-size:14px;font-weight:600;padding:10px 19px;cursor:pointer;transition:.15s ease}button:hover{background:#3b82f6}button:active{transform:translateY(1px)}#status{color:#86efac;font-size:13px}.privacy{margin-top:18px;text-align:center;color:#64748b;font-size:12px}footer{width:100%;text-align:center;color:#475569;font-size:10px;padding:12px 10px 16px;letter-spacing:.15px}@media(max-width:850px){.info-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.page{padding-top:30px}.header h1{font-size:28px}.info-grid{grid-template-columns:1fr}.card{padding:16px}}
</style>
</head>
<body>
<div class="page">
<div class="header"><h1>RDP <span>→</span> XFreeRDP</h1><div class="subtitle">Конвертер RDP-подключений для Linux</div></div>
<div class="card">
<div id="dropZone"><div class="rdp-icon">RDP</div><div class="drop-title">Перетащите сюда RDP-файл</div><div class="drop-subtitle">или нажмите для выбора файла</div></div>
<input type="file" id="fileInput" accept=".rdp">
<div id="resultBlock">
<div class="info-grid">
<div class="info-item"><span class="info-label">Файл</span><span class="info-value" id="fileName"></span></div>
<div class="info-item"><span class="info-label">Сервер</span><span class="info-value" id="serverInfo"></span></div>
<div class="info-item"><span class="info-label">Режим</span><span class="info-value" id="modeInfo"></span></div>
<div class="info-item"><span class="info-label">Балансировка</span><span class="info-value" id="balanceInfo"></span></div>
</div>
<div class="result-title">Команда XFreeRDP</div>
<div class="terminal"><div class="terminal-bar"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div><textarea id="result" spellcheck="false"></textarea></div>
<div class="actions"><button id="copyButton">Копировать команду</button><span id="status"></span></div>
</div>
</div>
<div class="privacy">Файл обрабатывается локально в браузере и никуда не отправляется</div>
</div>
<footer>Ребятам ПРМ ИТО от ГПН БС</footer>
<script>
"use strict";
const dropZone=document.getElementById("dropZone"),fileInput=document.getElementById("fileInput"),resultBlock=document.getElementById("resultBlock"),result=document.getElementById("result"),copyButton=document.getElementById("copyButton"),status=document.getElementById("status"),fileName=document.getElementById("fileName"),serverInfo=document.getElementById("serverInfo"),modeInfo=document.getElementById("modeInfo"),balanceInfo=document.getElementById("balanceInfo");
dropZone.addEventListener("click",()=>fileInput.click());fileInput.addEventListener("change",()=>{if(fileInput.files.length>0)processFile(fileInput.files[0])});dropZone.addEventListener("dragover",e=>{e.preventDefault();dropZone.classList.add("dragover")});dropZone.addEventListener("dragleave",()=>dropZone.classList.remove("dragover"));dropZone.addEventListener("drop",e=>{e.preventDefault();dropZone.classList.remove("dragover");if(e.dataTransfer.files.length>0)processFile(e.dataTransfer.files[0])});
copyButton.addEventListener("click",async()=>{try{await navigator.clipboard.writeText(result.value);status.textContent="✓ Скопировано"}catch{result.select();document.execCommand("copy");status.textContent="✓ Скопировано"}setTimeout(()=>status.textContent="",2500)});
async function processFile(file){status.textContent="";if(!file.name.toLowerCase().endsWith(".rdp")){status.textContent="Выберите .rdp файл";return}try{const buffer=await file.arrayBuffer(),text=decodeRdp(buffer),rdp=parseRdp(text),command=buildXFreeRdpCommand(rdp);result.value=command;fileName.textContent=file.name;const server=getValue(rdp,"full address")||"-";serverInfo.textContent=server;const remoteApp=enabled(rdp,"remoteapplicationmode");modeInfo.textContent=remoteApp?"RemoteApp":"Рабочий стол";const loadBalance=getValue(rdp,"loadbalanceinfo");if(loadBalance){balanceInfo.textContent=getCollectionName(loadBalance);balanceInfo.classList.add("active")}else{balanceInfo.textContent="Нет";balanceInfo.classList.remove("active")}resultBlock.style.display="block"}catch(error){console.error(error);status.textContent="Ошибка: "+error.message}}
function decodeRdp(buffer){const bytes=new Uint8Array(buffer);if(bytes.length>=2&&bytes[0]===255&&bytes[1]===254)return new TextDecoder("utf-16le").decode(bytes.slice(2));if(bytes.length>=2&&bytes[0]===254&&bytes[1]===255)return new TextDecoder("utf-16be").decode(bytes.slice(2));if(bytes.length>=3&&bytes[0]===239&&bytes[1]===187&&bytes[2]===191)return new TextDecoder("utf-8").decode(bytes.slice(3));return new TextDecoder("utf-8").decode(bytes)}
function parseRdp(text){const rdp={};for(const line of text.split(/\r?\n/)){if(!line.trim())continue;const match=line.match(/^(.*?):([sib]):(.*)$/);if(!match)continue;const name=match[1].trim().toLowerCase();rdp[name]={type:match[2],value:match[3]}}return rdp}
function getValue(rdp,name,defaultValue=""){const key=name.toLowerCase();return key in rdp?rdp[key].value:defaultValue}function enabled(rdp,name){return getValue(rdp,name)==="1"}function shellQuote(value){return "'"+value.replaceAll("'","'\\''")+"'"}
function getCollectionName(loadBalanceInfo){if(!loadBalanceInfo)return"Нет";const marker="MS Terminal Services Plugin.1.",index=loadBalanceInfo.indexOf(marker);if(index!==-1){const name=loadBalanceInfo.substring(index+marker.length);if(name)return name}return"Есть"}
function buildXFreeRdpCommand(rdp){const args=[];let domain=getValue(rdp,"domain");if(!domain)domain="gazprom-neft.local";args.push("/d:"+domain);const server=getValue(rdp,"full address");if(!server)throw new Error("не найден full address");let port=getValue(rdp,"server port");if(!port)port="3389";args.push(port==="3389"?"/v:"+server:"/v:"+server+":"+port);const loadBalanceInfo=getValue(rdp,"loadbalanceinfo");if(loadBalanceInfo)args.push(shellQuote("/load-balance-info:"+loadBalanceInfo));args.push('/p:$(zenity --entry --title="Domain Password" --text="Введите пароль от учетной записи $USER:" --hide-text)');const remoteApp=enabled(rdp,"remoteapplicationmode");if(remoteApp){let program=getValue(rdp,"remoteapplicationprogram");if(!program)program=getValue(rdp,"alternate shell");if(program)args.push(shellQuote("/app:program:"+program));const cmd=getValue(rdp,"remoteapplicationcmdline");if(cmd)args.push(shellQuote("/app:cmd:"+cmd))}args.push("/kbd-type:en-ru");let bpp=getValue(rdp,"session bpp");if(!bpp)bpp="32";args.push("/bpp:"+bpp);args.push("/network:auto");if(enabled(rdp,"redirectclipboard"))args.push("/clipboard");if(enabled(rdp,"redirectprinters"))args.push("/printer");if(enabled(rdp,"redirectsmartcards"))args.push("/smartcard");if(enabled(rdp,"use multimon"))args.push("/multimon");args.push("/sec:tls");args.push("/cert:ignore");if(enabled(rdp,"autoreconnection enabled"))args.push("+auto-reconnect");if(!remoteApp)args.push("+dynamic-resolution");args.push("+home-drive");return"xfreerdp "+args.join(" ")}
</script>
</body>
</html>
